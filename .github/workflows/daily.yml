name: Daily Tribology Tender Scan

on:
  schedule:
    - cron: '30 2 * * *'   # 2:30 UTC = 8:00 AM IST, every day
  workflow_dispatch:        # lets you trigger it manually too, from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run tender engine
        run: python3 tribology_tender_engine.py --out tribology_tenders_india.csv

      - name: Commit results back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily tender scan update"
          file_pattern: tribology_tenders_india.csv
